# trust-types compatibility surface for Trust Codegen
#
# This crate intentionally uses the package name `trust-types` so feature-gated
# Trust Codegen bridge code can depend on `trust_types` without resolving the full
# tRust compiler workspace during ordinary Trust Codegen builds.

