[package]
name = "trust-cg-cli"
description = "Command-line driver for the proof-oriented Trust Codegen backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[[bin]]
name = "trust-cg"
path = "src/main.rs"

[[bin]]
name = "ty_replay_jit_probe"
path = "src/bin/ty_replay_jit_probe.rs"

[dependencies]
trust-cg-codegen = { workspace = true }
trust-cg-opt = { workspace = true }
trust-cg-verify = { workspace = true }
trust-ir = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
rayon = "1.10"

[dev-dependencies]
# Only `tests/pgo_profile_use.rs` names trust-cg-ir directly; the binaries
# reach its types through trust-cg-codegen.
trust-cg-ir = { workspace = true }
trust-ir-build = { workspace = true }
# The REFERENCE wasm validator (Bytecode Alliance), same pin the codegen
# crate's `tests/wasm_module_validation.rs` uses: the CLI wasm-lane tests
# claim the emitted bytes are a well-formed module, so they validate them with
# an independent implementation of the spec rather than checking the magic
# header. Dev-only; the CLI's production graph MUST NOT gain this dependency.
wasmparser = "0.240.0"

[lints]
workspace = true
