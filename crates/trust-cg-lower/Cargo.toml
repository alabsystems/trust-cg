[package]
name = "trust-cg-lower"
description = "trust-ir to Low-level IR lowering for Trust Codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = []
# WP-2 experimental lane, OFF by default. OD-27 requires a replayed
# RefinementType premise before guard elision. No such rechecker exists in
# trust-cg: enabling this feature mints no production source capability and
# removes no guard. Predicate implication diagnostics remain available.
lattice-guard-elision = []
# Test-only mutation knobs (`trust_cg_lower::mutation_knobs`) that re-introduce
# historical miscompiles so differential gates can prove they catch them.
# NEVER enabled by a shipped build: `MUTATION_KNOBS` reports it, and every knob
# starts OFF even when the feature is compiled in.
mutation-knobs = []

[dependencies]
# Shared machine IR model (canonical type definitions)
trust-cg-ir = { workspace = true }

# trust-ir (input IR) — real crate from trust-ir repo
trust-ir = { workspace = true }
trust-ir-build = { workspace = true }

# Utilities
serde = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Property-based testing for the panic-fuzz harness on `translate_function`
# (#387 / #372 Phase 2). proptest is dev-only; it MUST NOT leak into the
# production graph.
proptest = "1.7"
