# rustc_codegen_trust_cg toolchain pin: THE TRUST TOOLCHAIN.
#
# This crate links rustc internals through `#![feature(rustc_private)]`, and
# the compiler it is a backend FOR is Trust's `trustc` — so it is built with,
# and against, the Trust toolchain (rustup's `trust` toolchain: the
# atpkg-delivered pack, or a stage sysroot linked by the Trust bootstrap).
# It used to pin a stock upstream nightly (`nightly-2026-04-20`, rustc 1.97);
# that meant the backend was compiled by a compiler it could never be loaded
# into, and its rustc-API surface drifted from the compiler that actually
# ships it. The Trust superproject's self-host lane (`-Zcodegen-backend=
# trust-ir-cg`) builds this exact crate with its own stage compiler.
#
# API drift against the Trust compiler surfaces as E0046/E0050/E0432 and is
# fixed in `src/lib.rs`, version-shimmed through `build.rs` probes where an
# older rustc must keep building.
#
# `rustc-dev` (the rustc_private rmetas + librustc_driver) ships in the Trust
# sysroot; `rust-src` is needed by the tests' fixtures only.
[toolchain]
channel = "trust"
