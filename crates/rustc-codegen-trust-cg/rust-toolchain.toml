# rustc_codegen_trust_cg v0.1.0 nightly pin.
#
# This standalone research-preview bridge links rustc internals through
# `#![feature(rustc_private)]`; both those APIs and the `CodegenBackend` dylib
# ABI are unstable. Change this date only with a clean bridge rebuild and the
# focused integration tests. Trait drift commonly appears as E0046, E0050, or
# E0432 and must be fixed in `src/lib.rs` as part of the same pin update.
#
# Pinned compiler:
#     rustc 1.97.0-nightly (e22c616e4 2026-04-19)
#
# The in-tree `rustc_codegen_cranelift` reference source used for
# trait-shape guidance lives at:
#
#     $(rustup run nightly-2026-04-20 rustc --print sysroot)/lib/rustlib/rustc-src/rust/compiler/rustc_codegen_cranelift/src/lib.rs
#
# `rustc-dev` and `rust-src` are required because this crate links
# against rustc internal crates via `#![feature(rustc_private)]`.
# `llvm-tools` matches cranelift's component list.
[toolchain]
channel = "nightly-2026-04-20"
components = ["rust-src", "rustc-dev", "llvm-tools", "rustfmt"]
profile = "minimal"
