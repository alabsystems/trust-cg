# rustc_codegen_trust_cg — experimental rustc codegen backend for the Trust
# compiler.
#
# This crate is a `rustc_private` codegen backend, built with and loaded by the
# Trust toolchain (`rust-toolchain.toml` `channel = "trust"`). It is NOT part of
# the Trust Codegen workspace (its own manifest and lock). Build with
# `targo --unverified build`.
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates
# License: Apache-2.0
[package]
name = "rustc_codegen_trust_cg"
version = "0.1.0"
edition = "2021"
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]
license = "Apache-2.0"
description = "Experimental Trust Codegen backend for the Trust rustc (trustc)"
publish = false
repository = "https://github.com/alabsystems/trust-cg"
homepage = "https://github.com/alabsystems/trust-cg"

[lib]
# rustc loads the codegen backend as a dylib through
# `-Zcodegen-backend=<path>`. On macOS that resolves to `.dylib`, on
# Linux `.so`. This matches rustc_codegen_cranelift's crate-type.
crate-type = ["dylib"]

[features]
default = []
# Forward optional AY allocation support to codegen and register allocation.
# Runtime selection and candidate validation remain in those crates. Enabling
# this feature alone is not evidence of solver execution or code correctness.
ay-regalloc = ["trust-cg-codegen/ay-regalloc"]

[build-dependencies]
# Only classify complete compiler diagnostics from throwaway API probes.
serde_json = "1.0"

[dependencies]
tempfile = "3"
# Keep the per-function certificate surface compiled in while disabling other
# codegen defaults. Available certificate APIs do not mean every emitted
# function has a complete, nonvacuous formal proof; admission checks the actual
# evidence. AY and Clean are managed aterm executables, not bundled by Cargo.
trust-cg-codegen = { path = "../trust-cg-codegen", default-features = false, features = ["verify"] }
trust-cg-lower = { path = "../trust-cg-lower" }
# The structural SSA / loop-completeness checker lives in trust-cg-verify.
# This direct dependency does not enable that crate's optional default features.
trust-cg-verify = { path = "../trust-cg-verify", default-features = false }
# Direct dependency (not `workspace = true`): this crate is its own workspace (see the
# empty `[workspace]` below), so it cannot inherit `trust-ir` from the main
# Trust Codegen workspace. The git source + features mirror the root workspace's
# `workspace.dependencies.trust-ir` so feature unification with the
# trust-cg-codegen/trust-cg-lower path deps stays consistent.
trust-ir = { git = "https://github.com/alabsystems/trust-ir.git", rev = "899d46e7a303fad2b706a88a7a8eda41ec47dcfe", features = ["serde", "parser", "binary", "dialect-verif-example", "clean-expr"] }

[dev-dependencies]
# Test-only: construct every `CompileError` / `PipelineError` payload so each
# variant's diagnostic layer code is asserted (`src/compile_error_diag_tests.rs`).
# All four are already in this crate's dependency graph through trust-cg-codegen.
rayon = "1.12"
serde_json = "1.0"
trust-cg-ir = { path = "../trust-cg-ir" }
trust-cg-opt = { path = "../trust-cg-opt" }
# The solver-coupled `src/` tests run every AY query on the FRESH one-shot
# transcript (thread-local `TCG_NO_SOLVER_SERVER=1` through this crate's
# override API), exactly as the strict formal campaign does: the resident
# `ay --incremental` server discards stderr, where AY publishes its decisive
# `(:reason-unknown …)` diagnostics, so through it a certification gap
# truncates to a bare `unknown` that no guard may exempt.
trust-cg-process-env = { path = "../trust-cg-process-env", features = ["trust-child-resources"] }
# Test-only: the WS7.3-pre regression (`tests/mir_lane_valid_trust_ir.rs`)
# holds the MIR lane's emitted modules to trust-ir's own validator. Same rev
# and features as the root workspace's pin, and already in this crate's graph
# through trust-cg-codegen / trust-cg-lower, so no new package is built.
trust-ir-build = { git = "https://github.com/alabsystems/trust-ir.git", rev = "899d46e7a303fad2b706a88a7a8eda41ec47dcfe", features = ["binary"] }

[package.metadata.rust-analyzer]
# Tell rust-analyzer to enable `rustc_private` so it indexes our
# extern crate rustc_* statements correctly.
rustc_private = true

# Keep this crate OUT of the Trust Codegen cargo workspace on purpose. It links
# against rustc internals (`rustc_private`) of the Trust compiler; those
# concerns must not leak into the rest of the workspace.
[workspace]

# rustc loads this backend dylib during compilation. Preserve the selected
# release profile; build time, library size, and loader cost require fresh
# artifact- and target-specific measurements. ELF archive-symbol localization
# is configured separately by emit_hidden_rlib_symbols in build.rs.
[profile.release]
lto = "thin"
codegen-units = 1

# The AY identity rule (crates/trust-cg-verify/src/ay_identity.rs) digests the
# toolchain AY (~90 MB) once per process before starting it. sha2's aarch64
# backend is intrinsics that are not inlined at opt-level 0: measured
# 2026-09-17 on this machine, 0.64-1.52 s per process with sha2 unoptimized
# versus 35-50 ms with this package optimized (and 41-50 ms in release).
[profile.dev.package.sha2]
opt-level = 3
