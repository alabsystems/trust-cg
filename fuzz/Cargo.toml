# trust-cg cargo-fuzz crate
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: Apache-2.0
#
# Part of #448 (#387 follow-up) — corpus-based panic-fuzz targets for the
# six properties already covered by the proptest harnesses:
#   - fuzz_encode_instruction.rs  (panic_fuzz_encode)
#   - fuzz_translate_function.rs  (panic_fuzz_lower)
#   - fuzz_compile_function.rs    (panic_fuzz_compile)
#   - fuzz_compile_x86_64.rs      (panic_fuzz_compile_x86_64)
#   - fuzz_macho_fixup.rs         (panic_fuzz_macho_fixup)
#   - fuzz_verify_module.rs       (panic_fuzz_verify)
#
# This crate is intentionally *not* a workspace member — cargo-fuzz builds
# it as a standalone package so the libFuzzer runtime link flags do not
# contaminate normal `cargo build` / `cargo test` invocations elsewhere.
#
# Run (STOCK EXCEPTION: Trust ships no cargo-fuzz, AddressSanitizer runtime or
# rust-lld; measured `trustc -Zsanitizer=address` -> "ld: library
# 'rustc-trust_rt.asan' not found". Requires a stock toolchain with
# `cargo install cargo-fuzz`):
#   cargo fuzz list --fuzz-dir fuzz
#   cargo fuzz run fuzz_encode_instruction --fuzz-dir fuzz -- -max_total_time=60
#
# Compile-check used by the publication gate (the Trust toolchain):
#   targo --unverified check --locked --manifest-path fuzz/Cargo.toml
#
# Linux AArch64 campaign lane (fixed seed and budget, retained JSON, and
# planted panic, leak and AddressSanitizer negative controls built with
# `--features negative-control`):
#   python3 -B scripts/run_linux_fuzz_lane.py --out <new dir outside the tree>

[package]
name = "trust-cg-cargo-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/alabsystems/trust-cg"
homepage = "https://github.com/alabsystems/trust-cg"

[package.metadata]
cargo-fuzz = true

[features]
# Negative controls for scripts/run_linux_fuzz_lane.py: with this feature,
# fuzz_encode_instruction panics, leaks a heap allocation or reads past one on
# an input that starts with the matching planted marker, so the lane must
# report that run as a crash, a leak or a sanitizer error. Never enabled by
# the campaign build.
negative-control = []

[dependencies]
libfuzzer-sys = "0.4"

trust-cg-ir = { path = "../crates/trust-cg-ir" }
trust-cg-lower = { path = "../crates/trust-cg-lower" }
trust-cg-codegen = { path = "../crates/trust-cg-codegen" }
trust-cg-opt = { path = "../crates/trust-cg-opt" }
trust-cg-verify = { path = "../crates/trust-cg-verify" }

# Prevent workspace auto-inclusion. The parent workspace explicitly lists
# its members; keeping `fuzz/` out means it won't be built by a plain
# `cargo build` at the repo root, which is important because libFuzzer
# requires nightly + a special sanitizer-enabled link path.
[workspace]

# libFuzzer targets.

[[bin]]
name = "fuzz_encode_instruction"
path = "fuzz_targets/fuzz_encode_instruction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_translate_function"
path = "fuzz_targets/fuzz_translate_function.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_compile_function"
path = "fuzz_targets/fuzz_compile_function.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_compile_x86_64"
path = "fuzz_targets/fuzz_compile_x86_64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_macho_fixup"
path = "fuzz_targets/fuzz_macho_fixup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_verify_module"
path = "fuzz_targets/fuzz_verify_module.rs"
test = false
doc = false
bench = false
